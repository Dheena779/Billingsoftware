services:
  - type: web
    name: billing-software-cloud
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: BILLING_SECRET_KEY
        generateValue: true
