<!DOCTYPE html>
<html>
<head>
    <title>Activate License</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-card {
            max-width: 450px;
        }
        .license-msg {
            color: #dc2626;
            background: #fef2f2;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid #f87171;
        }
    </style>
</head>

<body class="login-page">

<div class="login-card">
    <div class="logo">
        <div class="logo-icon">🔑</div>
        <h1>Software Activation</h1>
        <p>Billing Software</p>
    </div>

    <div class="license-msg" id="msgBox">
        {{ message }}
    </div>

    <form id="licenseForm">
        <label>Enter License Key</label>
        <textarea id="licenseKey" rows="3" placeholder="KEY-..." required style="width:100%; padding:12px; border-radius:8px; border:1px solid #d1d5db; margin-bottom:20px; font-family:monospace; resize:none;"></textarea>

        <button type="submit" id="submitBtn" class="primary-button">
            Activate Software
        </button>
    </form>
</div>

<script>
    document.getElementById("licenseForm").addEventListener("submit", async e => {
        e.preventDefault();
        
        const btn = document.getElementById("submitBtn");
        const msg = document.getElementById("msgBox");
        const key = document.getElementById("licenseKey").value.trim();
        
        btn.disabled = true;
        btn.innerText = "Verifying...";
        
        try {
            const res = await fetch("/api/license", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ license_key: key })
            });
            
            const data = await res.json();
            
            if (res.ok && data.success) {
                msg.style.color = "#16a34a";
                msg.style.background = "#dcfce7";
                msg.style.borderColor = "#4ade80";
                msg.innerText = "Activation Successful! Redirecting...";
                setTimeout(() => window.location.href = "/dashboard", 1000);
            } else {
                throw new Error(data.error || "Invalid License Key");
            }
        } catch (err) {
            msg.style.color = "#dc2626";
            msg.style.background = "#fef2f2";
            msg.style.borderColor = "#f87171";
            msg.innerText = err.message;
            btn.disabled = false;
            btn.innerText = "Activate Software";
        }
    });
</script>

</body>
</html>
