<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports - Billing Software</title>

    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f8fafc, #eef2ff);
            color: #111827;
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            height: 70px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { font-size: 21px; font-weight: 800; letter-spacing: -0.5px; }
        .brand span { color: #4f46e5; }

        .nav-links { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        .nav-links a {
            text-decoration: none;
            color: #4b5563;
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .nav-links a:hover, .nav-links a.active { background: #eef2ff; color: #4f46e5; }
        .nav-links a.logout { color: #dc2626; }

        /* LAYOUT */
        .container { max-width: 1600px; width: 100%; margin: auto; padding: 35px 25px 60px; }

        .page-header h1 { font-size: 30px; letter-spacing: -1px; }
        .page-header p { margin-top: 6px; color: #6b7280; margin-bottom: 24px; }

        /* TABS */
        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .tab {
            border: 1px solid #e5e7eb;
            background: #fff;
            color: #4b5563;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s ease;
        }

        .tab:hover { border-color: #c7d2fe; color: #4f46e5; }

        .tab.active {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #fff;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
        }

        /* FILTER */
        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
        }

        .filter-card { margin-bottom: 20px; }

        .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

        .preset {
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: #4b5563;
            cursor: pointer;
            font-family: inherit;
        }

        .preset:hover { border-color: #c7d2fe; color: #4f46e5; }
        .preset.active { background: #eef2ff; border-color: #a5b4fc; color: #4f46e5; }

        .filter-row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .field input {
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
        }

        .field input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .arrow { padding-bottom: 10px; color: #9ca3af; }

        .generate-btn {
            background: #4f46e5;
            color: #fff;
            border: 0;
            padding: 11px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .generate-btn:hover { background: #4338ca; }
        .generate-btn:disabled { opacity: 0.6; cursor: wait; }

        .filter-note { margin-top: 12px; font-size: 12px; color: #6b7280; }

        /* STAT CARDS */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
        }

        .stat span { display: block; font-size: 12px; font-weight: 700; color: #6b7280; margin-bottom: 8px; }
        .stat strong { font-size: 26px; letter-spacing: -0.5px; }
        .stat small { display: block; margin-top: 4px; font-size: 11px; color: #9ca3af; }
        .stat.green strong { color: #059669; }
        .stat.amber strong { color: #d97706; }
        .stat.red strong { color: #dc2626; }

        .section-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; }
        .block { margin-bottom: 20px; }

        /* CHART */
        .chart-wrap { width: 100%; overflow-x: auto; }
        .chart-wrap svg { display: block; width: 100%; height: auto; min-width: 520px; }

        /* TABLE */
        .table-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }

        th {
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #6b7280;
            padding: 11px 12px;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        td { padding: 12px; border-bottom: 1px solid #f3f4f6; }
        tr:last-child td { border-bottom: 0; }
        td.num, th.num { text-align: right; }
        td.num { font-variant-numeric: tabular-nums; }
        .muted { color: #9ca3af; }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge.in { background: #d1fae5; color: #047857; }
        .badge.low { background: #fef3c7; color: #b45309; }
        .badge.out { background: #fee2e2; color: #b91c1c; }

        /* TOP PRODUCTS BARS */
        .bar-row { display: grid; grid-template-columns: 170px 1fr 110px; gap: 12px; align-items: center; margin-bottom: 12px; font-size: 14px; }
        .bar-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar-track { background: #eef2ff; border-radius: 999px; height: 12px; overflow: hidden; }
        .bar-fill { background: linear-gradient(90deg, #6366f1, #4f46e5); height: 100%; border-radius: 999px; }
        .bar-val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

        /* STATES */
        .state { text-align: center; padding: 50px 20px; color: #6b7280; }
        .error-box { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }

        .inline-field { display: inline-flex; align-items: center; gap: 8px; }
        .inline-field input { width: 90px; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-family: inherit; }

        @media (max-width: 700px) {
            .navbar { padding: 0 16px; height: auto; min-height: 64px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
            .container { padding: 24px 14px 50px; }
            .bar-row { grid-template-columns: 110px 1fr 90px; }
            .stat strong { font-size: 22px; }
        }

        @media print {
            .navbar, .tabs, .filter-card, .no-print, button, .download-btn, .print-btn, #customerSearchInput { display: none !important; }
            body { background: #fff !important; color: #000 !important; font-size: 10pt !important; }
            .container { padding: 0 !important; max-width: 100% !important; margin: 0 !important; }
            .card { border: 1px solid #cbd5e1 !important; box-shadow: none !important; margin-bottom: 15px !important; break-inside: avoid; }
            table { width: 100% !important; border-collapse: collapse !important; font-size: 10pt !important; }
            th, td { border: 1px solid #cbd5e1 !important; padding: 6px !important; }
            .chart-wrap { break-inside: avoid; }
        }

        .download-btn {
            background: #10b981;
            color: white;
            border: 0;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            transition: 0.2s ease;
        }
        .download-btn:hover { background: #059669; transform: translateY(-1px); }

        .print-btn {
            background: #4f46e5;
            color: white;
            border: 0;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
            transition: 0.2s ease;
        }
        .print-btn:hover { background: #4338ca; transform: translateY(-1px); }

        .download-pdf-btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: 0;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 6px 16px rgba(79,70,229,0.25);
            transition: 0.2s ease;
        }
        .download-pdf-btn:hover { transform: translateY(-2px); }

            /* FULL RESPONSIVE V2.0 */
        @media (max-width: 1024px) {
            .container { padding: 20px; }
        }
        @media (max-width: 768px) {
            .container { padding: 15px; width: 100%; max-width: 100%; margin: 0; }
            .tabs { display: flex; overflow-x: auto; white-space: nowrap; flex-wrap: nowrap; padding-bottom: 5px; -webkit-overflow-scrolling: touch; }
            .tab { flex-shrink: 0; }
            .filter-row { display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
            .filter-row input, .filter-row button { width: 100%; margin: 0; }
            .presets { display: flex; overflow-x: auto; white-space: nowrap; flex-wrap: nowrap; padding-bottom: 5px; gap: 8px; }
            .preset { flex-shrink: 0; margin: 0; }
            .stat { margin-bottom: 10px; width: 100%; }
            .grid-2, .grid-3 { display: flex !important; flex-direction: column; gap: 15px; }
            .table-wrap, .result-div { overflow-x: auto; width: 100%; }
            .page-header { flex-direction: column; }
        }
        
        /* Animations */
        .card, .stat, .result-div { animation: slideUp 0.4s ease-out forwards; opacity: 0; transform: translateY(15px); }
        .stat:nth-child(1) { animation-delay: 0.1s; }
        .stat:nth-child(2) { animation-delay: 0.2s; }
        .stat:nth-child(3) { animation-delay: 0.3s; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        input, select, button { transition: all 0.2s ease; }
        input:focus, select:focus { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.1); }
    </style>

</head>

<body>

    {% include 'navbar.html' %}


    <main class="container">

        <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
            <div>
                <h1>Reports</h1>
                <p>Sales, products, stock, customers and payments - calculated from your bills.</p>
            </div>
        </div>


        <div class="tabs" id="tabs">
            <button class="tab active" data-tab="sales">📈 Sales</button>
            <button class="tab" data-tab="products">🛒 Products</button>
            <button class="tab" data-tab="stock">📦 Stock</button>
            <button class="tab" data-tab="customers">👤 Customers</button>
            <button class="tab" data-tab="payments">💳 Payments</button>
        </div>


        <section class="card filter-card">

            <div id="dateControls">

                <div class="presets" id="presets">
                    <button class="preset" data-preset="today">Today</button>
                    <button class="preset" data-preset="yesterday">Yesterday</button>
                    <button class="preset" data-preset="week">This Week</button>
                    <button class="preset active" data-preset="month">This Month</button>
                    <button class="preset" data-preset="all">All Time</button>
                    <button class="preset" data-preset="custom">Custom</button>
                </div>

                <div class="filter-row">

                    <div class="field">
                        <label for="fromDate">From</label>
                        <input type="date" id="fromDate">
                    </div>

                    <div class="arrow">→</div>

                    <div class="field">
                        <label for="toDate">To</label>
                        <input type="date" id="toDate">
                    </div>

                    <button class="generate-btn" id="generateBtn">Generate Report</button>

                </div>

                <div class="filter-note">Week starts on Monday.</div>

            </div>

            <div id="stockControls" style="display:none;">

                <div class="filter-row">

                    <div class="field">
                        <label for="lowStock">Low-stock level (units)</label>
                        <input type="number" id="lowStock" min="0" step="1" value="{{ '%g' % default_low_stock }}">
                    </div>

                    <button class="generate-btn" id="stockBtn">Generate Report</button>

                </div>

                <div class="filter-note">
                    Stock is a live snapshot of today, so it does not use a date range.
                    Products at or below this level (but above 0) are shown as low stock.
                </div>

            </div>

        </section>

        <div id="output"></div>

    </main>


<script>

    let activeTab = "sales";
    let requestId = 0;

    const output = document.getElementById("output");

    /* =========================================
       HELPERS
    ========================================= */

    function isoDate(d) {
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${d.getFullYear()}-${m}-${day}`;
    }

    function addDays(d, n) {
        const c = new Date(d);
        c.setDate(c.getDate() + n);
        return c;
    }

    function money(v) {
        return "₹" + Number(v || 0).toLocaleString("en-IN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function moneyShort(v) {
        return "₹" + Number(v || 0).toLocaleString("en-IN", {
            maximumFractionDigits: 0
        });
    }

    function qty(v) {
        return Number(v || 0).toLocaleString("en-IN", { maximumFractionDigits: 3 });
    }

    function esc(v) {
        return String(v ?? "")
            .replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function prettyDate(iso) {
        const [y, m, d] = iso.split("-").map(Number);
        return new Date(y, m - 1, d).toLocaleDateString("en-IN", {
            day: "2-digit", month: "short", year: "numeric"
        });
    }

    function prettyDateTime(utcString) {
        if (!utcString) return "—";
        // bills are stored in UTC by SQLite
        const d = new Date(utcString.replace(" ", "T") + "Z");
        return d.toLocaleString("en-IN", {
            day: "2-digit", month: "short", year: "numeric",
            hour: "2-digit", minute: "2-digit"
        });
    }

    /* =========================================
       DATE PRESETS
    ========================================= */

    function applyPreset(name) {

        const today = new Date();
        let from = today, to = today;

        if (name === "yesterday") {
            from = to = addDays(today, -1);
        } else if (name === "week") {
            const offset = (today.getDay() + 6) % 7;   // Monday = 0
            from = addDays(today, -offset);
        } else if (name === "month") {
            from = new Date(today.getFullYear(), today.getMonth(), 1);
        } else if (name === "all") {
            from = new Date(2000, 0, 1);
            to = today;
        } else if (name === "custom") {
            document.querySelectorAll(".preset").forEach(
                b => b.classList.toggle("active", b.dataset.preset === "custom")
            );
            return;
        }

        document.getElementById("fromDate").value = isoDate(from);
        document.getElementById("toDate").value = isoDate(to);

        document.querySelectorAll(".preset").forEach(
            b => b.classList.toggle("active", b.dataset.preset === name)
        );

        loadReport();
    }

    document.getElementById("presets").addEventListener("click", e => {
        const b = e.target.closest(".preset");
        if (b) applyPreset(b.dataset.preset);
    });

    ["fromDate", "toDate"].forEach(id =>
        document.getElementById(id).addEventListener("change", () =>
            document.querySelectorAll(".preset").forEach(
                b => b.classList.toggle("active", b.dataset.preset === "custom")
            )
        )
    );

    /* =========================================
       TABS
    ========================================= */

    document.getElementById("tabs").addEventListener("click", e => {

        const t = e.target.closest(".tab");
        if (!t) return;

        activeTab = t.dataset.tab;

        document.querySelectorAll(".tab").forEach(
            b => b.classList.toggle("active", b === t)
        );

        const isStock = activeTab === "stock";

        document.getElementById("dateControls").style.display = isStock ? "none" : "";
        document.getElementById("stockControls").style.display = isStock ? "" : "none";
        document.getElementById("generateBtn").style.display = "";

        loadReport();
    });

    document.getElementById("generateBtn").addEventListener("click", loadReport);
    document.getElementById("stockBtn").addEventListener("click", loadReport);

    /* =========================================
       LOAD & CSV EXPORT HELPERS
    ========================================= */

    let currentReportData = null;
    let selectedCustomerData = null;

    function downloadCSV(filename, rows) {
        if (!rows || !rows.length) {
            alert("No data available to download.");
            return;
        }
        const csvContent = "\uFEFF" + rows.map(r => 
            r.map(val => {
                if (val === null || val === undefined) return '""';
                let s = String(val).replace(/"/g, '""');
                return `"${s}"`;
            }).join(",")
        ).join("\r\n");

        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", filename);
        link.style.visibility = "hidden";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    async function loadReport() {

        const from = document.getElementById("fromDate").value;
        const to = document.getElementById("toDate").value;

        if (activeTab !== "stock" && (!from || !to)) {
            output.innerHTML = `<div class="error-box">Please choose both dates.</div>`;
            return;
        }

        const params = new URLSearchParams();

        if (activeTab === "stock") {
            params.set("low_stock", document.getElementById("lowStock").value || {{ default_low_stock }});
        } else {
            params.set("from_date", from);
            params.set("to_date", to);
        }

        const buttons = [document.getElementById("generateBtn"), document.getElementById("stockBtn")];
        buttons.forEach(b => b.disabled = true);

        const myRequest = ++requestId;
        const tab = activeTab;

        output.innerHTML = `<div class="card state">Loading report…</div>`;

        try {

            const res = await fetch(`/api/reports/${tab}?${params}`, { credentials: "same-origin" });

            if (res.status === 401) { window.location.href = "/"; return; }

            const text = await res.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch (jsonErr) {
                const cleanText = text.replace(/<[^>]*>/g, '').trim().slice(0, 150);
                throw new Error(cleanText ? `Server error (${res.status}): ${cleanText}` : `Server returned error status ${res.status}`);
            }

            if (!res.ok) throw new Error(data.error || "Unable to load report");

            if (myRequest !== requestId) return;

            currentReportData = data;

            const renderers = {
                sales: renderSales, products: renderProducts, stock: renderStock,
                customers: renderCustomers, payments: renderPayments
            };

            output.innerHTML = renderers[tab](data);

        } catch (err) {

            if (myRequest === requestId) {
                output.innerHTML = `<div class="error-box">${esc(err.message)}</div>`;
            }

        } finally {
            buttons.forEach(b => b.disabled = false);
        }
    }

    /* =========================================
       RENDERERS
    ========================================= */

    function rangeLabel(d) {
        return d.from_date === d.to_date
            ? prettyDate(d.from_date)
            : `${prettyDate(d.from_date)} → ${prettyDate(d.to_date)}`;
    }

    function stat(label, value, cls = "", note = "") {
        return `<div class="stat ${cls}"><span>${label}</span><strong>${value}</strong>${note ? `<small>${note}</small>` : ""}</div>`;
    }

    function emptyState(text) {
        return `<div class="card state">${text}</div>`;
    }

    /* ---------- SALES ---------- */

    function downloadSalesCSV() {
        if (!currentReportData || !currentReportData.trend) {
            alert("No sales data available to download.");
            return;
        }
        const from = document.getElementById("fromDate")?.value || "";
        const to = document.getElementById("toDate")?.value || "";
        const rows = [
            ["Date", "Bills Count", "Total Sales Amount (INR)"]
        ];
        [...currentReportData.trend].forEach(r => {
            rows.push([r.date, r.bills, r.sales]);
        });
        downloadCSV(`Sales_Report_${from}_to_${to}.csv`, rows);
    }

    function renderSales(d) {

        const s = d.summary;

        return `
            <div class="stats">
                ${stat("Total Sales", money(s.total_sales), "green", rangeLabel(d))}
                ${stat("Total Bills", s.total_bills)}
                ${stat("Line Items Sold", s.line_items, "", "Product lines across all bills")}
                ${stat("Average Bill", money(s.average_bill))}
            </div>

            <div class="card block">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
                    <div class="section-title" style="margin:0;">Sales Trend</div>
                    <div style="display:flex; gap:8px;" class="no-print">
                        <button class="download-btn" onclick="downloadSalesCSV()">📥 Download CSV</button>
                        <button class="print-btn" onclick="window.print()">🖨️ Print</button>
                    </div>
                </div>
                ${s.total_bills ? trendChart(d.trend) : `<div class="state">No bills in this period.</div>`}
            </div>

            <div class="card block">
                <div class="section-title">Daily Breakdown</div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Date</th><th class="num">Bills</th><th class="num">Sales</th></tr></thead>
                        <tbody>
                            ${[...d.trend].reverse().map(r => `
                                <tr>
                                    <td>${prettyDate(r.date)}</td>
                                    <td class="num">${r.bills}</td>
                                    <td class="num">${r.sales ? money(r.sales) : '<span class="muted">—</span>'}</td>
                                </tr>`).join("")}
                        </tbody>
                    </table>
                </div>
            </div>`;
    }

    function trendChart(points) {

        const W = 900, H = 280, L = 62, R = 16, T = 16, B = 40;
        const iw = W - L - R, ih = H - T - B;

        const max = Math.max(...points.map(p => p.sales), 1);
        const niceMax = niceCeil(max);
        const n = points.length;

        const x = i => n === 1 ? L + iw / 2 : L + (iw * i) / (n - 1);
        const y = v => T + ih - (v / niceMax) * ih;

        let grid = "";

        for (let i = 0; i <= 4; i++) {
            const v = (niceMax / 4) * i;
            grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e7eb"/>
                     <text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#6b7280">${moneyShort(v)}</text>`;
        }

        const step = Math.max(1, Math.ceil(n / 8));
        let labels = "";

        points.forEach((p, i) => {
            if (i % step === 0 || i === n - 1) {
                const [, m, d] = p.date.split("-");
                labels += `<text x="${x(i)}" y="${H - 14}" text-anchor="middle" font-size="11" fill="#6b7280">${d}/${m}</text>`;
            }
        });

        const line = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.sales).toFixed(1)}`).join(" ");
        const area = `${line} L${x(n - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;

        const dots = points.map((p, i) => `
            <circle cx="${x(i)}" cy="${y(p.sales)}" r="${n > 40 ? 2 : 4}" fill="#4f46e5">
                <title>${prettyDate(p.date)} — ${money(p.sales)} (${p.bills} bills)</title>
            </circle>`).join("");

        return `
            <div class="chart-wrap">
                <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales trend">
                    ${grid}
                    <path d="${area}" fill="rgba(79,70,229,0.10)"/>
                    <path d="${line}" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round"/>
                    ${dots}
                    ${labels}
                </svg>
            </div>`;
    }

    function niceCeil(v) {
        const p = Math.pow(10, Math.floor(Math.log10(v)));
        const f = v / p;
        const nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
        return nf * p;
    }

        }

        const badge = document.getElementById(`billStatusBadge_${billId}`);
        if (badge) {
            const isPaid = newStatus === "Paid";
            badge.textContent = newStatus;
            badge.style.background = isPaid ? "#dcfce7" : "#fee2e2";
            badge.style.color = isPaid ? "#16a34a" : "#dc2626";
        }

        const card = document.getElementById(`billCard_${billId}`);
        if (card) {
            card.style.borderLeftColor = newStatus === "Paid" ? "#16a34a" : "#ef4444";
        }

        const saveBtn = document.getElementById(`saveStatusBtn_${billId}`);
        if (saveBtn) {
            saveBtn.style.background = "#2563eb";
            saveBtn.style.transform = "scale(1.04)";
        }
    }

    async function saveBillPaymentStatus(billId) {
        const btn = document.getElementById(`saveStatusBtn_${billId}`);
        if (btn) {
            btn.disabled = true;
            btn.textContent = "⏳ Saving...";
        }

        await updateBillPaymentStatus(billId);

        if (btn) {
            btn.disabled = false;
            btn.style.background = "#16a34a";
            btn.style.transform = "none";
            btn.textContent = "✓ Saved!";
            setTimeout(() => {
                if (btn) btn.textContent = "💾 Save";
            }, 1800);
        }

        // Refresh report tables and widgets
        if (typeof loadReport === "function") {
            try { await loadReport(); } catch(e) {}
        }
    }

    async function updateBillPaymentStatus(billId, customVal = null) {
        const selectEl = document.getElementById(`billStatusSelect_${billId}`);
        const val = customVal || (selectEl ? selectEl.value : "");
        if (!val) return;

        let newStatus = "Paid";
        let newMethod = "Cash";

        if (val.startsWith("Paid_")) {
            newStatus = "Paid";
            newMethod = val.replace("Paid_", "");
        } else if (val.includes("_")) {
            const parts = val.split("_");
            newStatus = parts[0];
            newMethod = parts[1];
        } else {
            newStatus = val;
            newMethod = val;
        }

        try {
            const res = await fetch(`/api/bills/${billId}/payment-status`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ payment_status: newStatus, payment_method: newMethod })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Failed to update payment status");

            // Update badge immediately right beside it
            const badge = document.getElementById(`billStatusBadge_${billId}`);
            if (badge) {
                const isPaid = newStatus === "Paid";
                badge.textContent = newStatus;
                badge.style.background = isPaid ? "#dcfce7" : "#fee2e2";
                badge.style.color = isPaid ? "#16a34a" : "#dc2626";
            }

            // Update card border-left
            const card = document.getElementById(`billCard_${billId}`);
            if (card) {
                card.style.borderLeftColor = newStatus === "Paid" ? "#16a34a" : "#ef4444";
            }

            // Update method text
            const methodEl = document.getElementById(`billMethod_${billId}`);
            if (methodEl) {
                methodEl.innerHTML = `💳 Method: <strong>${esc(newMethod)}</strong>`;
            }

            // Update customer totals in memory and on-screen
            if (selectedCustomerData && selectedCustomerData.bills) {
                const b = selectedCustomerData.bills.find(x => x.id === billId);
                if (b) {
                    b.payment_status = newStatus;
                    b.payment_method = newMethod;
                    const paid = selectedCustomerData.bills.filter(x => x.payment_status === "Paid").reduce((s, x) => s + x.total, 0);
                    const unpaid = selectedCustomerData.bills.filter(x => x.payment_status !== "Paid").reduce((s, x) => s + x.total, 0);
                    const paidEl = document.getElementById("customerTotalPaid");
                    const unpaidEl = document.getElementById("customerTotalUnpaid");
                    if (paidEl) paidEl.textContent = money(paid);
                    if (unpaidEl) unpaidEl.textContent = money(unpaid);
                }
            }

            // Refresh background report tables silently
            if (typeof loadReportSilent === "function") {
                loadReportSilent();
            }
        } catch (err) {
            alert("Error updating payment status: " + err.message);
        }
    }

    async function loadReportSilent() {
        const from = document.getElementById("fromDate")?.value || "";
        const to = document.getElementById("toDate")?.value || "";
        const params = new URLSearchParams();
        if (activeTab === "stock") {
            params.set("low_stock", document.getElementById("lowStock")?.value || {{ default_low_stock }});
        } else {
            params.set("from_date", from);
            params.set("to_date", to);
        }
        try {
            const res = await fetch(`/api/reports/${activeTab}?${params}`, { credentials: "same-origin" });
            if (!res.ok) return;
            const text = await res.text();
            currentReportData = JSON.parse(text);
        } catch (e) {}
    }

    function markBillAsPaid(billId) { updateBillPaymentStatus(billId, "Paid_Cash"); }
    function revertBillToUnpaid(billId) { updateBillPaymentStatus(billId, "Loan_Loan"); }

    function closeCustomerDetails() {
        const container = document.getElementById("customerDetailsSection");
        if (container) container.style.display = "none";
    }

    function renderCustomers(d) {

        if (!d.customers.length) return emptyState("No customer bills in this period.");

        const totalPurchased = d.customers.reduce((sum, c) => sum + (c.total_amount || 0), 0);
        const totalPaid = d.customers.reduce((sum, c) => sum + (c.total_paid || 0), 0);
        const totalUnpaid = d.customers.reduce((sum, c) => sum + (c.total_unpaid || 0), 0);

        return `
            <div class="stats">
                ${stat("Total Customers", d.unique_customers, "", rangeLabel(d))}
                ${stat("Total Purchased", money(totalPurchased), "green")}
                ${stat("Total Paid", money(totalPaid), "")}
                ${stat("Pending / Credit", money(totalUnpaid), totalUnpaid > 0 ? "red" : "")}
            </div>

            <!-- CUSTOMER DETAILS / PURCHASE TRACKING VIEW -->
            <div id="customerDetailsSection" style="display:none; margin-bottom:24px;"></div>

            <!-- ALL CUSTOMERS DIRECTORY TABLE -->
            <div class="card block" id="customerDirectoryCard">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
                    <div>
                        <div class="section-title" style="margin:0; font-size:17px; font-weight:800;">👥 Customer Directory &amp; Sales</div>
                        <div style="font-size:12px; color:#6b7280; margin-top:3px;">Showing all customer purchases for ${rangeLabel(d)}. Click on any customer to track their complete itemized purchase history.</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;" class="no-print">
                        <input type="text" id="customerSearchInput" placeholder="🔍 Search name or phone..." oninput="filterCustomerTable()" style="padding:8px 14px; border:1px solid #cbd5e1; border-radius:8px; font-size:13px; width:220px;">
                        <button class="download-btn" onclick="downloadCustomersCSV()" title="Download Customer List in CSV">📥 Download</button>
                        <button class="print-btn" onclick="window.print()">🖨️ Print</button>
                    </div>
                </div>

                <div class="table-wrap">
                    <table id="customerTable">
                        <thead>
                            <tr>
                                <th>Customer Name</th>
                                <th>Phone Number</th>
                                <th class="num">Bills</th>
                                <th class="num">Total Purchased</th>
                                <th class="num">Paid</th>
                                <th class="num">Credit / Unpaid</th>
                                <th>Last Purchase</th>
                                <th class="no-print" style="text-align:center;">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${d.customers.map(c => `
                                <tr>
                                    <td>
                                        <a href="javascript:void(0)" onclick="viewCustomerDetails('${esc(c.customer_name)}', '${esc(c.customer_phone)}')" style="font-weight:700; color:#2563eb; text-decoration:none;" title="Click to view purchase history">
                                            ${esc(c.customer_name || "Walk-in Customer")} ↗
                                        </a>
                                    </td>
                                    <td>${c.customer_phone ? `<span style="font-family:monospace; font-size:13px; color:#475569;">📞 ${esc(c.customer_phone)}</span>` : '<span class="muted">—</span>'}</td>
                                    <td class="num">${c.bills}</td>
                                    <td class="num" style="font-weight:700;">${money(c.total_amount)}</td>
                                    <td class="num" style="color:#16a34a; font-weight:600;">${money(c.total_paid)}</td>
                                    <td class="num" style="color:${c.total_unpaid > 0 ? '#dc2626' : '#6b7280'}; font-weight:${c.total_unpaid > 0 ? '700' : '400'};">${money(c.total_unpaid)}</td>
                                    <td style="font-size:12px; color:#6b7280;">${prettyDateTime(c.last_purchase)}</td>
                                    <td class="no-print" style="text-align:center;">
                                        <button class="download-btn" style="background:#4f46e5; padding:5px 12px; font-size:12px; box-shadow:none;" onclick="viewCustomerDetails('${esc(c.customer_name)}', '${esc(c.customer_phone)}')">
                                            🔍 Track Purchases
                                        </button>
                                    </td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
            </div>`;
    }

    /* ---------- PAYMENTS ---------- */

    function jumpToCustomer(name, phone) {
        viewCustomerDetails(name, phone);
    }

    window.jumpToCustomer = jumpToCustomer;

    function downloadPaymentsCSV() {
        if (!currentReportData || !currentReportData.methods) {
            alert("No payments data available to download.");
            return;
        }
        const from = document.getElementById("fromDate")?.value || "";
        const to = document.getElementById("toDate")?.value || "";

        const rows = [
            ["Payment Method", "Bills Count", "Amount Collected (INR)", "Customer Name", "Customer Phone", "Customer Bills", "Customer Amount (INR)"]
        ];

        currentReportData.methods.forEach(m => {
            if (m.customers && m.customers.length > 0) {
                m.customers.forEach(c => {
                    rows.push([
                        m.method,
                        m.bills,
                        m.amount,
                        c.customer_name || "",
                        c.customer_phone || "",
                        c.bills_count,
                        c.amount
                    ]);
                });
            } else {
                rows.push([
                    m.method,
                    m.bills,
                    m.amount,
                    "",
                    "",
                    "",
                    ""
                ]);
            }
        });

        downloadCSV(`Payments_Report_${from}_to_${to}.csv`, rows);
    }

    function renderPayments(d) {
        const get = name => d.methods.find(m => m.method === name) || { amount: 0, bills: 0 };
        const unrecorded = get("Not recorded");
        
        const pendingAmount = d.methods.filter(m => ["Credit", "Pending", "Loan", "Unpaid"].includes(m.method))
            .reduce((sum, m) => sum + m.amount, 0);
        const pendingBills = d.methods.filter(m => ["Credit", "Pending", "Loan", "Unpaid"].includes(m.method))
            .reduce((sum, m) => sum + m.bills, 0);

        return `
            <div class="stats">
                ${stat("Total Collected", money(d.total_collected), "green", rangeLabel(d))}
                ${stat("Cash", money(get("Cash").amount), "", `${get("Cash").bills} bills`)}
                ${stat("UPI", money(get("UPI").amount), "", `${get("UPI").bills} bills`)}
                ${stat("Card", money(get("Card").amount), "", `${get("Card").bills} bills`)}
                ${stat("Pending / Unpaid", money(pendingAmount), "amber", `${pendingBills} bills`)}
            </div>

            <!-- CUSTOMER DETAILS / PURCHASE & INVOICE VIEW (INSIDE PAYMENTS TAB) -->
            <div id="customerDetailsSection" style="display:none; margin-bottom:24px;"></div>

            <div class="card block">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
                    <div class="section-title" style="margin:0;">Payment Summary</div>
                    <div style="display:flex; gap:8px;" class="no-print">
                        <button class="download-btn" onclick="downloadPaymentsCSV()">📥 Download CSV</button>
                        <button class="print-btn" onclick="window.print()">🖨️ Print</button>
                    </div>
                </div>
                <div class="table-wrap">
                    <table style="width:100%; border-collapse:collapse;">
                        <thead>
                            <tr>
                                <th>Method <span style="font-size:11px; font-weight:normal; color:#6b7280;">(Click to expand)</span></th>
                                <th class="num">Bills</th>
                                <th class="num">Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${d.methods.filter(m => m.method !== "Not recorded" || m.bills).map(m => `
                                <tr style="border-bottom:1px solid #f3f4f6;">
                                    <td colspan="3" style="padding:0;">
                                        <details style="padding:10px 8px; cursor:pointer;">
                                            <summary style="display:flex; justify-content:space-between; align-items:center; list-style:none;">
                                                <div style="flex:1; font-weight:600; color:#4f46e5;">
                                                    ${m.method} <span style="font-size:12px; color:#9ca3af; margin-left:6px;">▶</span>
                                                </div>
                                                <div style="width:100px; text-align:right;">${m.bills}</div>
                                                <div style="width:120px; text-align:right; font-weight:600;">${money(m.amount)}</div>
                                            </summary>
                                            
                                            ${m.customers && m.customers.length > 0 ? `
                                            <div style="margin-top:12px; background:#f9fafb; padding:12px; border-radius:8px; border:1px solid #e5e7eb;">
                                                <div style="font-size:12px; font-weight:700; color:#6b7280; margin-bottom:8px; display:flex;">
                                                    <div style="flex:1;">Customer</div>
                                                    <div style="width:80px; text-align:right;">Bills</div>
                                                    <div style="width:110px; text-align:right;">Amount</div>
                                                    <div style="width:110px; text-align:center;">Action</div>
                                                </div>
                                                ${m.customers.map(c => `
                                                    <div style="display:flex; padding:8px 0; border-bottom:1px solid #f3f4f6; font-size:13px; align-items:center; flex-wrap:wrap; gap:8px;">
                                                        <div style="flex:1; min-width:180px;">
                                                            <a href="javascript:void(0)" onclick="viewCustomerDetails('${esc(c.customer_name)}', '${esc(c.customer_phone)}')" style="color:#2563eb; text-decoration:none; font-weight:700;">
                                                                ${esc(c.customer_name || "Customer")} ↗
                                                            </a>
                                                            ${c.customer_phone ? `<span style="color:#6b7280; margin-left:6px; font-size:12px;">📞 ${esc(c.customer_phone)}</span>` : ""}
                                                        </div>
                                                        <div style="width:80px; text-align:right; color:#4b5563;">${c.bills_count} ${c.bills_count === 1 ? 'bill' : 'bills'}</div>
                                                        <div style="width:110px; text-align:right; font-weight:700; color:#111827;">${money(c.amount)}</div>
                                                        <div style="width:110px; text-align:center;" class="no-print">
                                                            <button class="download-btn" style="background:#4f46e5; padding:4px 10px; font-size:11px; box-shadow:none;" onclick="viewCustomerDetails('${esc(c.customer_name)}', '${esc(c.customer_phone)}')">
                                                                🔍 Invoices
                                                            </button>
                                                        </div>
                                                    </div>
                                                `).join("")}
                                            </div>
                                            ` : `<div style="margin-top:10px; color:#6b7280; font-size:13px; padding:0 12px;">No detailed customer data for this method.</div>`}
                                        </details>
                                    </td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
                ${unrecorded.bills ? `<div class="filter-note">“Not recorded” = bills made before payment methods were added. They are not included in Total Collected.</div>` : ""}
            </div>`;
    }

    /* =========================================
       INIT
    ========================================= */

    applyPreset("month");

</script>
