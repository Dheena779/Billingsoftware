<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founder Login - Cloud Billing Master Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .login-box {
            background: white;
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .login-box h1 {
            font-size: 24px;
            font-weight: 900;
            color: #0f172a;
            text-align: center;
            margin-bottom: 6px;
        }
        .login-box .subtitle {
            font-size: 13px;
            color: #64748b;
            text-align: center;
            margin-bottom: 28px;
        }
        .badge {
            display: block;
            text-align: center;
            margin-bottom: 24px;
        }
        .badge span {
            background: #dc2626;
            color: white;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .field { margin-bottom: 18px; }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.2s;
        }
        .field input:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
        }
        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }
        .back-link a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="badge"><span>🔒 Restricted Access</span></div>
    <h1>Founder Master Panel</h1>
    <p class="subtitle">Cloud Billing SaaS — Super Admin Dashboard</p>

    {% if error %}
    <div class="error">❌ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/founder">
        <div class="field">
            <label for="username">Founder Username</label>
            <input type="text" id="username" name="username" placeholder="Enter founder username" required autocomplete="off">
        </div>

        <div class="field">
            <label for="password">Master Password</label>
            <input type="password" id="password" name="password" placeholder="Enter master password" required>
        </div>

        <button type="submit" class="submit-btn">🔐 Access Master Dashboard</button>
    </form>

    <div class="back-link">
        <a href="/login">← Back to Store Login</a>
    </div>
</div>

</body>
</html>
