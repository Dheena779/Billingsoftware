<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bill History - Billing Software</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f8fafc,
                    #eef2ff
                );

            color: #111827;

            min-height: 100vh;

        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            height: 70px;

            background: rgba(
                255,
                255,
                255,
                0.92
            );

            backdrop-filter: blur(14px);

            border-bottom:
                1px solid #e5e7eb;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 32px;

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .brand {

            font-size: 21px;

            font-weight: 800;

            letter-spacing: -0.5px;

        }


        .brand span {

            color: #4f46e5;

        }


        .nav-links {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .nav-links a {

            text-decoration: none;

            color: #4b5563;

            padding:
                9px 14px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: 600;

            transition:
                0.2s ease;

        }


        .nav-links a:hover {

            background: #eef2ff;

            color: #4f46e5;

        }


        .logout {

            color: #dc2626 !important;

        }


        /* =========================
           MAIN
        ========================= */

        .container {

            max-width: 1600px; width: 100%;

            margin: auto;

            padding: 35px 25px 60px;

        }


        .page-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 28px;

            animation:
                fadeUp 0.5s ease;

        }


        .page-header h1 {

            font-size: 30px;

            letter-spacing: -1px;

        }


        .page-header p {

            margin-top: 6px;

            color: #6b7280;

        }


        .new-bill-btn {

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #6366f1
                );

            color: white;

            border: none;

            padding:
                12px 18px;

            border-radius: 12px;

            font-weight: 700;

            cursor: pointer;

            text-decoration: none;

            box-shadow:
                0 8px 20px
                rgba(
                    79,
                    70,
                    229,
                    0.22
                );

            transition:
                0.2s ease;

        }


        .new-bill-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(
                    79,
                    70,
                    229,
                    0.30
                );

        }


        /* =========================
           SUMMARY CARDS
        ========================= */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap: 18px;

            margin-bottom: 24px;

        }


        .summary-card {

            background: white;

            border:
                1px solid #e5e7eb;

            border-radius: 18px;

            padding: 22px;

            box-shadow:
                0 10px 30px
                rgba(
                    15,
                    23,
                    42,
                    0.05
                );

            animation:
                fadeUp 0.6s ease;

        }


        .summary-label {

            font-size: 13px;

            color: #6b7280;

            font-weight: 600;

            text-transform:
                uppercase;

            letter-spacing:
                0.5px;

        }


        .summary-value {

            margin-top: 8px;

            font-size: 28px;

            font-weight: 800;

        }


        /* =========================
           FILTERS
        ========================= */

        .filter-card {

            background: white;

            border:
                1px solid #e5e7eb;

            border-radius: 18px;

            padding: 20px;

            margin-bottom: 22px;

            box-shadow:
                0 10px 30px
                rgba(
                    15,
                    23,
                    42,
                    0.05
                );

            animation:
                fadeUp 0.7s ease;

        }


        .filters {

            display: grid;

            grid-template-columns:
                2fr
                1fr
                1fr
                auto;

            gap: 12px;

            align-items: end;

        }


        .field {

            display: flex;

            flex-direction: column;

            gap: 6px;

        }


        .field label {

            font-size: 12px;

            font-weight: 700;

            color: #6b7280;

        }


        .field input {

            height: 44px;

            border:
                1px solid #d1d5db;

            border-radius: 10px;

            padding:
                0 13px;

            outline: none;

            font-size: 14px;

            transition:
                0.2s ease;

        }


        .field input:focus {

            border-color:
                #6366f1;

            box-shadow:
                0 0 0 3px
                rgba(
                    99,
                    102,
                    241,
                    0.12
                );

        }


        .filter-btn {

            height: 44px;

            border: none;

            border-radius: 10px;

            padding:
                0 20px;

            background: #111827;

            color: white;

            font-weight: 700;

            cursor: pointer;

            transition:
                0.2s ease;

        }


        .filter-btn:hover {

            transform:
                translateY(-1px);

            background: #1f2937;

        }


        /* =========================
           TABLE
        ========================= */

        .table-card {

            background: white;

            border:
                1px solid #e5e7eb;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 10px 30px
                rgba(
                    15,
                    23,
                    42,
                    0.05
                );

            animation:
                fadeUp 0.8s ease;

        }


        .table-wrapper {

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse:
                collapse;

            min-width: 700px;

        }


        thead {

            background: #f8fafc;

        }


        th {

            padding:
                15px 18px;

            text-align: left;

            font-size: 12px;

            color: #6b7280;

            text-transform:
                uppercase;

            letter-spacing:
                0.4px;

        }


        td {

            padding:
                16px 18px;

            border-top:
                1px solid #f1f5f9;

            font-size: 14px;

        }


        tbody tr {

            transition:
                0.2s ease;

        }


        tbody tr:hover {

            background: #fafbff;

        }


        .bill-number {

            font-weight: 800;

            color: #4f46e5;

        }


        .amount {

            font-weight: 800;

        }


        .action-group {

            display: flex;

            gap: 8px;

        }


        .action-btn {

            border: none;

            border-radius: 8px;

            padding:
                8px 11px;

            cursor: pointer;

            font-size: 12px;

            font-weight: 700;

            text-decoration: none;

            display: inline-flex;

            align-items: center;

            justify-content: center;

        }


        .view-btn {

            background: #eef2ff;

            color: #4338ca;

        }


        .print-btn {

            background: #ecfdf5;

            color: #047857;

        }


        .items-btn {

            background: #f0fdf4;

            color: #15803d;

            border: 1px solid #bbf7d0;

        }


        .items-btn:hover {

            background: #dcfce7;

        }


        .edit-btn {

            background: #fffbeb;

            color: #b45309;

            border: 1px solid #fde68a;

        }


        .edit-btn:hover {

            background: #fef3c7;

        }


        .delete-btn {

            background: #fef2f2;

            color: #dc2626;

            border: 1px solid #fecaca;

        }


        .delete-btn:hover {

            background: #fee2e2;

        }


        /* =========================
           ITEMS MODAL
        ========================= */

        .modal-overlay {

            position: fixed;

            inset: 0;

            background: rgba(15, 23, 42, 0.55);

            backdrop-filter: blur(4px);

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 1000;

            padding: 20px;

        }


        .modal-box {

            background: white;

            border-radius: 18px;

            width: 100%;

            max-width: 680px;

            max-height: 85vh;

            display: flex;

            flex-direction: column;

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);

            overflow: hidden;

            animation: modalIn 0.25s ease;

        }


        @keyframes modalIn {

            from {

                opacity: 0;

                transform: scale(0.95) translateY(10px);

            }

            to {

                opacity: 1;

                transform: scale(1) translateY(0);

            }

        }


        .modal-header {

            padding: 20px 24px;

            border-bottom: 1px solid #e5e7eb;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .modal-body {

            padding: 20px 24px;

            overflow-y: auto;

            flex: 1;

        }


        .modal-footer {

            padding: 16px 24px;

            border-top: 1px solid #e5e7eb;

            display: flex;

            justify-content: space-between;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;

            background: #f8fafc;

        }


        .modal-close-btn {

            border: none;

            background: #f1f5f9;

            color: #475569;

            font-size: 18px;

            font-weight: 700;

            width: 32px;

            height: 32px;

            border-radius: 8px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .modal-close-btn:hover {

            background: #e2e8f0;

        }


        .empty {

            text-align: center;

            padding: 55px 20px;

            color: #6b7280;

        }


        .empty-icon {

            font-size: 40px;

            margin-bottom: 10px;

        }


        .loading {

            text-align: center;

            padding: 40px;

            color: #6b7280;

        }


        .error {

            padding: 15px;

            margin-bottom: 15px;

            background: #fef2f2;

            border:
                1px solid #fecaca;

            color: #b91c1c;

            border-radius: 10px;

            display: none;

        }


        /* =========================
           ANIMATION
        ========================= */

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(15px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .navbar {

                padding:
                    0 16px;

            }


            .nav-links a {

                font-size: 12px;

                padding:
                    8px 9px;

            }


            .container {

                padding:
                    25px 15px 40px;

            }


            .page-header {

                align-items:
                    flex-start;

                gap: 15px;

                flex-direction:
                    column;

            }


            .summary-grid {

                grid-template-columns:
                    1fr;

            }


            .filters {

                grid-template-columns:
                    1fr;

            }


            .filter-btn {

                width: 100%;

            }

        }


        @media (max-width: 500px) {

            .brand {

                font-size: 17px;

            }


            .nav-links a {

                padding:
                    6px;

            }


            .page-header h1 {

                font-size: 25px;

            }

        }

            /* FULL RESPONSIVE V2.0 */
        @media (max-width: 1024px) {
            .container { padding: 20px; }
        }
        @media (max-width: 768px) {
            .container { padding: 15px; width: 100%; max-width: 100%; }
            .filter-row { display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
            .filter-row input, .filter-row button, .filter-row select { width: 100%; margin: 0; }
            .table-wrap { overflow-x: auto; width: 100%; }
            .bill-row { font-size: 13px; }
            .action-buttons { display: flex; flex-direction: column; gap: 5px; }
            .action-buttons button { width: 100%; justify-content: center; margin: 0; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .header-actions { width: 100%; display: flex; flex-direction: column; gap: 10px; }
            .header-actions button { width: 100%; margin: 0; }
        }
        
        /* Animations */
        .card, .table-wrap { animation: slideUp 0.4s ease-out forwards; opacity: 0; transform: translateY(15px); }
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        input, button, select { transition: all 0.2s ease; }
        input:focus, select:focus { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.1); }
    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    {% include 'navbar.html' %}


    <!-- =========================
         MAIN
    ========================== -->

    <main class="container">


        <div class="page-header">

            <div>

                <h1>
                    Bill History
                </h1>

                <p>
                    View and manage all generated invoices.
                </p>

            </div>


            <a
                href="/billing"
                class="new-bill-btn"
            >
                + New Bill
            </a>

        </div>


        <!-- ERROR -->

        <div
            id="errorBox"
            class="error"
        ></div>


        <!-- =========================
             SUMMARY
        ========================== -->

        <section class="summary-grid">


            <div class="summary-card">

                <div class="summary-label">
                    Total Bills
                </div>

                <div
                    class="summary-value"
                    id="totalBills"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Total Sales
                </div>

                <div
                    class="summary-value"
                    id="totalSales"
                >
                    ₹0.00
                </div>

            </div>


        </section>


        <!-- =========================
             FILTER
        ========================== -->

        <section class="filter-card">

            <div class="filters">


                <div class="field">

                    <label>
                        Search Invoice / Customer
                    </label>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Invoice no. or customer name"
                    >

                </div>


                <div class="field">

                    <label>
                        From Date
                    </label>

                    <input
                        type="date"
                        id="fromDate"
                    >

                </div>


                <div class="field">

                    <label>
                        To Date
                    </label>

                    <input
                        type="date"
                        id="toDate"
                    >

                </div>


                <button
                    class="filter-btn"
                    onclick="loadBills()"
                >
                    Search
                </button>

                <button
                    class="filter-btn"
                    onclick="loadAllBills()"
                    style="background:#4f46e5;"
                >
                    All Bills
                </button>

                <button
                    class="filter-btn"
                    onclick="downloadInvoicesZip()"
                    style="background:linear-gradient(135deg, #16a34a, #22c55e);"
                >
                    📦 Download Invoices (ZIP)
                </button>

            </div>

        </section>


        <!-- =========================
             TABLE
        ========================== -->

        <section class="table-card">

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Invoice
                            </th>

                            <th>
                                Customer
                            </th>

                            <th>
                                Date & Time
                            </th>

                            <th>
                                Items
                            </th>

                            <th>
                                Total
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="billTableBody"
                    >

                        <tr>

                            <td
                                colspan="6"
                                class="loading"
                            >
                                Loading bills...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>


    </main>

    <!-- ==============================================
         BILL ITEMS MODAL
    ============================================== -->
    <div id="billItemsModal" class="modal-overlay" style="display:none;" onclick="if(event.target === this) closeBillItemsModal()">
        <div class="modal-box">
            <div class="modal-header">
                <div>
                    <h3 id="modalBillNumber" style="font-size:18px; font-weight:800; color:#111827;">Bill Items</h3>
                    <div id="modalBillMeta" style="font-size:12px; color:#6b7280; margin-top:3px;"></div>
                </div>
                <button class="modal-close-btn" onclick="closeBillItemsModal()">✕</button>
            </div>
            <div class="modal-body">
                <div style="overflow-x:auto;">
                    <table style="width:100%; border-collapse:collapse; font-size:13px; min-width:auto;">
                        <thead>
                            <tr style="background:#f8fafc;">
                                <th style="padding:10px 12px; text-align:left;">Item</th>
                                <th style="padding:10px 12px; text-align:right;">Qty</th>
                                <th style="padding:10px 12px; text-align:right;">Price</th>
                                <th style="padding:10px 12px; text-align:right;">Total</th>
                                <th style="padding:10px 12px; text-align:center;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="modalItemsBody">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; padding-top:14px; border-top:2px solid #e5e7eb;">
                    <span style="font-weight:700; color:#374151;">Bill Total:</span>
                    <strong id="modalBillTotal" style="font-size:20px; color:#4f46e5;">₹0.00</strong>
                </div>
            </div>
            <div class="modal-footer">
                <div style="display:flex; gap:8px;">
                    <button id="modalReopenBtn" class="action-btn edit-btn" style="padding:9px 15px;">✏️ Re-open in Cart</button>
                    <button id="modalDeleteBtn" class="action-btn delete-btn" style="padding:9px 15px;">🗑️ Delete Entire Bill</button>
                </div>
                <button class="action-btn" style="background:#e5e7eb; color:#374151; padding:9px 15px;" onclick="closeBillItemsModal()">Close</button>
            </div>
        </div>
    </div>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadBills();

            }
        );

        function loadAllBills() {
            document.getElementById("fromDate").value = "";
            document.getElementById("toDate").value = "";
            document.getElementById("searchInput").value = "";
            loadBills();
        }

        function downloadInvoicesZip() {
            const from = document.getElementById("fromDate").value;
            const to = document.getElementById("toDate").value;
            window.location.href = `/api/reports/download-invoices-zip?start_date=${from}&end_date=${to}`;
        }


        async function loadBills() {

            const tbody =
                document.getElementById(
                    "billTableBody"
                );

            const errorBox =
                document.getElementById(
                    "errorBox"
                );


            errorBox.style.display =
                "none";


            tbody.innerHTML = `
                <tr>
                    <td
                        colspan="6"
                        class="loading"
                    >
                        Loading bills...
                    </td>
                </tr>
            `;


            const search =
                document.getElementById(
                    "searchInput"
                ).value.trim();


            const fromDate =
                document.getElementById(
                    "fromDate"
                ).value;


            const toDate =
                document.getElementById(
                    "toDate"
                ).value;


            const params =
                new URLSearchParams();


            if (search) {

                params.append(
                    "search",
                    search
                );

            }


            if (fromDate) {

                params.append(
                    "from_date",
                    fromDate
                );

            }


            if (toDate) {

                params.append(
                    "to_date",
                    toDate
                );

            }


            try {

                const response =
                    await fetch(
                        "/api/bills/history?" +
                        params.toString()
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Failed to load bills."
                    );

                }


                // -------------------------
                // SUMMARY
                // -------------------------

                document.getElementById(
                    "totalBills"
                ).textContent =
                    data.summary.total_bills;


                document.getElementById(
                    "totalSales"
                ).textContent =
                    formatCurrency(
                        data.summary.total_sales
                    );


                // -------------------------
                // EMPTY
                // -------------------------

                if (
                    !data.bills ||
                    data.bills.length === 0
                ) {

                    tbody.innerHTML = `
                        <tr>
                            <td
                                colspan="6"
                                class="empty"
                            >

                                <div class="empty-icon">
                                    🧾
                                </div>

                                <strong>
                                    No bills found
                                </strong>

                                <div>
                                    Try changing
                                    your search
                                    or date filter.
                                </div>

                            </td>
                        </tr>
                    `;

                    return;

                }


                // -------------------------
                // TABLE
                // -------------------------

                tbody.innerHTML =
                    data.bills.map(
                        bill => {

                            return `

                                <tr>

                                    <td>

                                        <div
                                            class="bill-number"
                                        >
                                            ${escapeHtml(
                                                bill.bill_number
                                            )}
                                        </div>

                                    </td>


                                    <td>

                                        ${bill.customer_name
                                            ? escapeHtml(bill.customer_name)
                                            : "—"}

                                    </td>


                                    <td>

                                        ${formatDate(
                                            bill.created_at
                                        )}

                                    </td>


                                    <td>

                                        ${bill.item_count}

                                    </td>


                                    <td>

                                        <span
                                            class="amount"
                                        >
                                            ${formatCurrency(
                                                bill.total
                                            )}
                                        </span>

                                    </td>


                                    <td>

                                        <div
                                            class="action-group"
                                        >

                                            <button
                                                class="action-btn items-btn"
                                                onclick="viewBillItems(${bill.id})"
                                                title="View and manage items in this bill"
                                            >
                                                📦 Items
                                            </button>

                                            <a
                                                class="action-btn view-btn"
                                                href="/invoice/${bill.id}"
                                                target="_blank"
                                                title="View invoice"
                                            >
                                                View
                                            </a>

                                            <button
                                                class="action-btn print-btn"
                                                onclick="printInvoice(${bill.id})"
                                                title="Print invoice"
                                            >
                                                Print
                                            </button>

                                            <button
                                                class="action-btn edit-btn"
                                                onclick="reopenBillInCart(${bill.id})"
                                                title="Re-open in Cart (cancels this bill, restores stock, and loads into cart)"
                                            >
                                                ✏️ Edit
                                            </button>

                                            <button
                                                class="action-btn delete-btn"
                                                onclick="deleteBill(${bill.id}, '${escapeHtml(bill.bill_number)}')"
                                                title="Delete this bill and restore stock"
                                            >
                                                🗑️ Delete
                                            </button>

                                        </div>

                                    </td>

                                </tr>

                            `;

                        }
                    ).join("");


            } catch (error) {

                console.error(
                    error
                );


                tbody.innerHTML = `
                    <tr>
                        <td
                            colspan="6"
                            class="empty"
                        >
                            Unable to load bills.
                        </td>
                    </tr>
                `;


                errorBox.textContent =
                    error.message;


                errorBox.style.display =
                    "block";

            }

        }


        function formatCurrency(
            amount
        ) {

            return new Intl.NumberFormat(
                "en-IN",
                {
                    style: "currency",
                    currency: "INR",
                    minimumFractionDigits: 2
                }
            ).format(
                Number(amount || 0)
            );

        }


        function formatDate(
            value
        ) {

            if (!value) {

                return "-";

            }


            const date =
                new Date(
                    value.replace(
                        " ",
                        "T"
                    ) + "Z"
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return value;

            }


            return date.toLocaleString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        function printInvoice(
            billId
        ) {

            const printWindow =
                window.open(
                    `/invoice/${billId}`,
                    "_blank"
                );


            if (!printWindow) {

                alert(
                    "Please allow pop-ups to print the invoice."
                );

                return;

            }


            printWindow.onload =
                function () {

                    printWindow.print();

                };

        }


        function escapeHtml(
            value
        ) {

            return String(
                value ?? ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        // Enter key = search

        document
            .getElementById(
                "searchInput"
            )
            .addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Enter"
                    ) {

                        loadBills();

                    }

                }
            );


        /* =====================================================
           DELETE BILL (Restores stock for all items)
        ===================================================== */

        async function deleteBill(billId, billNumber) {
            const confirmed = confirm(
                `Are you sure you want to delete bill ${billNumber}?\n\n` +
                "All billed items will be returned to stock, and the bill will be deleted from history."
            );

            if (!confirmed) return;

            try {
                const response = await fetch(`/api/bills/${billId}`, {
                    method: "DELETE",
                    credentials: "same-origin"
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.error || "Failed to delete bill.");
                    return;
                }

                alert(data.message || `Bill ${billNumber} deleted and stock restored.`);

                closeBillItemsModal();
                loadBills();

            } catch (err) {
                console.error("Delete bill error:", err);
                alert("Error deleting bill: " + err.message);
            }
        }


        /* =====================================================
           VIEW BILL ITEMS MODAL
        ===================================================== */

        let currentModalBillId = null;

        async function viewBillItems(billId) {
            currentModalBillId = billId;
            const modal = document.getElementById("billItemsModal");
            const tbody = document.getElementById("modalItemsBody");
            const titleEl = document.getElementById("modalBillNumber");
            const metaEl = document.getElementById("modalBillMeta");
            const totalEl = document.getElementById("modalBillTotal");
            const reopenBtn = document.getElementById("modalReopenBtn");
            const deleteBtn = document.getElementById("modalDeleteBtn");

            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:25px; color:#6b7280;">Loading items...</td></tr>`;
            modal.style.display = "flex";

            try {
                const response = await fetch(`/api/bills/${billId}/items`, {
                    credentials: "same-origin"
                });

                const data = await response.json();

                if (!response.ok) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:25px; color:#dc2626;">${escapeHtml(data.error || "Failed to load items")}</td></tr>`;
                    return;
                }

                const bill = data.bill;
                const items = data.items;

                titleEl.textContent = `Bill Items — ${bill.bill_number}`;
                metaEl.textContent = `Customer: ${bill.customer_name || "Walk-in"} ${bill.customer_phone ? "(" + bill.customer_phone + ")" : ""} • Payment: ${bill.payment_method || "Cash"} (${bill.payment_status || "Paid"})`;
                totalEl.textContent = formatCurrency(bill.total);

                reopenBtn.onclick = () => reopenBillInCart(bill.id);
                deleteBtn.onclick = () => deleteBill(bill.id, bill.bill_number);

                if (!items || items.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:25px; color:#6b7280;">No items found in this bill.</td></tr>`;
                    return;
                }

                tbody.innerHTML = items.map(item => `
                    <tr style="border-bottom: 1px solid #f1f5f9;">
                        <td style="padding:10px 12px; font-weight:600;">
                            ${escapeHtml(item.product_name)}
                            <div style="font-size:11px; color:#6b7280; font-weight:400;">Basis: ${escapeHtml(item.price_basis)}</div>
                        </td>
                        <td style="padding:10px 12px; text-align:right;">
                            ${item.quantity} ${escapeHtml(item.quantity_unit || item.price_basis)}
                        </td>
                        <td style="padding:10px 12px; text-align:right;">
                            ${formatCurrency(item.price)}
                        </td>
                        <td style="padding:10px 12px; text-align:right; font-weight:700;">
                            ${formatCurrency(item.total)}
                        </td>
                        <td style="padding:10px 12px; text-align:center;">
                            <button
                                class="action-btn delete-btn"
                                style="padding:5px 9px; font-size:11px;"
                                onclick="deleteBillItem(${bill.id}, ${item.id}, '${escapeHtml(item.product_name)}', ${item.quantity}, '${escapeHtml(item.quantity_unit || item.price_basis)}')"
                                title="Remove this item and return its stock to inventory"
                            >
                                🗑️ Remove
                            </button>
                        </td>
                    </tr>
                `).join("");

            } catch (err) {
                console.error("View items error:", err);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:25px; color:#dc2626;">Error: ${escapeHtml(err.message)}</td></tr>`;
            }
        }

        function closeBillItemsModal() {
            const modal = document.getElementById("billItemsModal");
            if (modal) modal.style.display = "none";
            currentModalBillId = null;
        }


        /* =====================================================
           DELETE SINGLE BILL ITEM (Restores stock for that item)
        ===================================================== */

        async function deleteBillItem(billId, itemId, itemName, qty, unit) {
            const confirmed = confirm(
                `Remove "${itemName}" from this bill?\n\n` +
                `${qty} ${unit} will be returned to stock, and the bill total will be recalculated.`
            );

            if (!confirmed) return;

            try {
                const response = await fetch(`/api/bills/${billId}/items/${itemId}`, {
                    method: "DELETE",
                    credentials: "same-origin"
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.error || "Failed to remove item.");
                    return;
                }

                alert(data.message || "Item removed and stock restored.");

                if (data.bill_deleted) {
                    closeBillItemsModal();
                    loadBills();
                } else {
                    // Refresh modal items and reload list
                    viewBillItems(billId);
                    loadBills();
                }

            } catch (err) {
                console.error("Delete bill item error:", err);
                alert("Error removing item: " + err.message);
            }
        }


        /* =====================================================
           RE-OPEN BILL IN CART (Cancels bill, restores stock, loads cart)
        ===================================================== */

        async function reopenBillInCart(billId) {
            const confirmed = confirm(
                "Re-open this bill in Cart?\n\n" +
                "This will cancel this bill, return all items to stock, and load them into your Cart so you can make changes and generate an updated bill."
            );

            if (!confirmed) return;

            try {
                // 1. Fetch items
                const res = await fetch(`/api/bills/${billId}/items`, { credentials: "same-origin" });
                const d = await res.json();

                if (!res.ok) {
                    alert(d.error || "Failed to load bill items.");
                    return;
                }

                const bill = d.bill;
                const items = d.items;

                // 2. Delete bill (which restores stock)
                const delRes = await fetch(`/api/bills/${billId}`, {
                    method: "DELETE",
                    credentials: "same-origin"
                });

                if (!delRes.ok) {
                    const delData = await delRes.json();
                    alert(delData.error || "Failed to cancel bill.");
                    return;
                }

                // 3. Format items for cart
                const cartItems = items.map(item => ({
                    id: Date.now() + Math.random(),
                    productId: item.product_id,
                    productName: item.product_name,
                    billingName: item.product_name,
                    quantity: Number(item.quantity),
                    unit: item.quantity_unit,
                    baseQuantity: Number(item.base_quantity),
                    price: Number(item.price),
                    originalPrice: Number(item.price),
                    discountPercent: Number(item.discount_percent || 0),
                    priceBasis: item.price_basis,
                    total: Number(item.total)
                }));

                // 4. Save into sessionStorage
                sessionStorage.setItem("restore_cart", JSON.stringify({
                    items: cartItems,
                    customer_name: bill.customer_name || "",
                    customer_phone: bill.customer_phone || "",
                    payment_method: bill.payment_method || "Cash"
                }));

                // 5. Navigate to billing page
                window.location.href = "/billing";

            } catch (err) {
                console.error("Reopen bill error:", err);
                alert("Error re-opening bill: " + err.message);
            }
        }

    </script>
