<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set up your business</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .setup-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .setup-card {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 40px;
            box-sizing: border-box;
        }

        .setup-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .setup-header h1 {
            margin: 0;
            font-size: 30px;
            color: #111827;
        }

        .setup-header p {
            margin-top: 10px;
            color: #6b7280;
            font-size: 15px;
        }

        .step {
            margin-bottom: 32px;
        }

        .step-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e5e7eb;
        }

        .step-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .step-title h2 {
            margin: 0;
            font-size: 19px;
            color: #111827;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .optional {
            color: #9ca3af;
            font-weight: normal;
        }

        .setup-button {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 14px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .setup-button:hover {
            background: #1d4ed8;
        }

        .error-message {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .help-text {
            margin-top: 6px;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 700px) {

            .setup-card {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="setup-container">

    <div class="setup-card">

        <div class="setup-header">

            <h1>Welcome! Set up your business</h1>

            <p>
                Let's configure your business before you start billing.
            </p>

        </div>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST" action="{{ url_for('setup') }}">

            <!-- ========================= -->
            <!-- BUSINESS DETAILS -->
            <!-- ========================= -->

            <div class="step">

                <div class="step-title">

                    <div class="step-number">1</div>

                    <h2>Business Details</h2>

                </div>


                <div class="form-grid">

                    <div class="form-group full">

                        <label>
                            Business / Store Name *
                        </label>

                        <input
                            type="text"
                            name="store_name"
                            placeholder="Example: ABC Supermarket"
                            required
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            Address *
                        </label>

                        <textarea
                            name="address"
                            placeholder="Enter your business address"
                            required
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label>
                            City *
                        </label>

                        <input
                            type="text"
                            name="city"
                            placeholder="Example: Chennai"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            State *
                        </label>

                        <input
                            type="text"
                            name="state"
                            placeholder="Example: Tamil Nadu"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            PIN / Postal Code *
                        </label>

                        <input
                            type="text"
                            name="postal_code"
                            placeholder="Example: 600001"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Phone *
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            placeholder="Example: 9876543210"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                            <span class="optional">(Optional)</span>
                        </label>

                        <input
                            type="email"
                            name="email"
                            placeholder="business@example.com"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            GSTIN
                            <span class="optional">(Optional)</span>
                        </label>

                        <input
                            type="text"
                            name="gstin"
                            placeholder="Example: 33ABCDE1234F1Z5"
                        >

                    </div>

                </div>

            </div>


            <!-- ========================= -->
            <!-- OWNER ACCOUNT -->
            <!-- ========================= -->

            <div class="step">

                <div class="step-title">

                    <div class="step-number">2</div>

                    <h2>Owner / Admin Account</h2>

                </div>


                <div class="form-grid">

                    <div class="form-group full">

                        <label>
                            Owner Name *
                        </label>

                        <input
                            type="text"
                            name="owner_name"
                            placeholder="Example: John Kumar"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Username *
                        </label>

                        <input
                            type="text"
                            name="username"
                            placeholder="Create username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Password *
                        </label>

                        <input
                            type="password"
                            name="password"
                            placeholder="Create password"
                            minlength="6"
                            required
                        >

                        <div class="help-text">
                            Minimum 6 characters
                        </div>

                    </div>


                    <div class="form-group full">

                        <label>
                            Confirm Password *
                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            placeholder="Re-enter password"
                            minlength="6"
                            required
                        >

                    </div>

                </div>

            </div>


            <!-- ========================= -->
            <!-- INVOICE SETTINGS -->
            <!-- ========================= -->

            <div class="step">

                <div class="step-title">

                    <div class="step-number">3</div>

                    <h2>Invoice Settings</h2>

                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Invoice Prefix
                        </label>

                        <input
                            type="text"
                            name="invoice_prefix"
                            value="INV"
                            placeholder="INV"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Starting Invoice Number
                        </label>

                        <input
                            type="number"
                            name="invoice_start_number"
                            value="1"
                            min="1"
                            required
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            Invoice Footer
                            <span class="optional">(Optional)</span>
                        </label>

                        <textarea
                            name="invoice_footer"
                            placeholder="Example: Thank you for your business!"
                        ></textarea>

                    </div>

                </div>

            </div>


            <button
                type="submit"
                class="setup-button"
            >
                Complete Setup & Continue
            </button>

        </form>

    </div>

</div>

</body>
</html>
