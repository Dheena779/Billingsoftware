<!DOCTYPE html>

<html>

<head>

    <title>Login - {{ store_name }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body class="login-page">


<div class="login-card">

    <div class="logo">

        {% if store_logo %}
        <img src="{{ store_logo }}" alt="Logo" style="max-height:70px;max-width:180px;margin-bottom:10px;">
        {% else %}
        <div class="logo-icon">
            {{ (store_name[:2] if store_name != "Billing" else "B")|upper }}
        </div>
        {% endif %}

        <h1>{{ store_name }}</h1>

        <p>Billing Software</p>

    </div>


    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


    <form method="POST">


        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button
            type="submit"
            class="primary-button"
        >

            Login

        </button>


    </form>


    <div class="demo-login" style="color: #6b7280; font-size: 13px;">
        Enter Your Credentials
    </div>


</div>


</body>

</html>
